[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "picklabel"
version = "0.1.0"
description = "Turn every robot pick into a free instance-segmentation label, then distill SAM 3 into a fast student."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohd Waqar Azim" }]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pillow>=10.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# SAM 2.1 / SAM 3 teachers and YOLO-seg students. SAM 3 needs ultralytics>=8.3.237.
models = ["ultralytics>=8.3.237"]
roboflow = ["roboflow>=1.1.50", "python-dotenv>=1.0"]
app = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "ruff>=0.5", "scipy>=1.11", "scikit-image>=0.22"]  # reference checks
all = ["picklabel[models,roboflow,app,dev]"]

[project.scripts]
picklabel = "picklabel.cli:main"

[tool.setuptools.packages.find]
include = ["picklabel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["ros2_ws/build", "ros2_ws/install", "ros2_ws/log", "notebooks"]  # notebooks use shell magics

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]
